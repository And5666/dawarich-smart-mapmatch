[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapmatch"
version = "2.0.0"
description = "Map matching for self-hosted Dawarich, with a review portal"
requires-python = ">=3.11"
# The engine (mapmatch.engine) uses only the standard library.
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["mapmatch*"]

[tool.setuptools.package-data]
"mapmatch.portal" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
