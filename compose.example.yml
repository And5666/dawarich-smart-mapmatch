# Mapmatch next to an existing Dawarich stack.
# Copy to compose.yml (or merge into your Dawarich compose file) and adjust.
services:
  mapmatch:
    build: .
    image: mapmatch:latest
    container_name: mapmatch
    restart: unless-stopped
    environment:
      # How the container reaches Dawarich on the docker network.
      DAWARICH_URL: http://dawarich_app:3000
      # Set when Dawarich only answers for its public hostname (APPLICATION_HOSTS).
      DAWARICH_HOST_HEADER: ""
      # First admin account. Change the password before you expose the portal.
      # Once an admin exists this is ignored.
      ADMIN_USER: admin
      ADMIN_PASSWORD: change-me-please
      # The map-matching server is NOT set here: an admin adds its address in the
      # portal (Admin -> Map matching) and every account uses it.
      # Optional: mount the Valhalla data directory read-only so an admin can
      # list and download region extracts and tiles from the portal.
      # VALHALLA_DATA_DIR: /valhalla
      # Serve under a path behind a reverse proxy, e.g. /mapmatch. Empty = site root.
      PORTAL_BASE_PATH: ""
      # Set to 1 when the portal is reached over https.
      PORTAL_SECURE_COOKIE: "0"
      # Start in dry-run: pushes are planned and logged but Dawarich is not changed.
      # Set to 0 once you have checked a few trips.
      PUSH_DRY_RUN: "1"
      # Refuse to start without an admin account (set ADMIN_PASSWORD), so nobody can register first.
      # REQUIRE_ADMIN: "1"
      # Part of another site? A link back, your stylesheet, a shared light/dark key:
      # PORTAL_HOME_URL: "/"
      # PORTAL_EXTRA_CSS: "/site.css"
      # PORTAL_THEME_KEY: "theme"
      # An offline basemap instead of CARTO's hosted one (docs/deploying.md):
      # PORTAL_PMTILES_URL: "/maps/region.pmtiles"
      # PORTAL_PMTILES_ASSETS: "/maps/lib/"
      MATCH_WORKERS: "4"
    volumes:
      # SQLite database with the archive of original GPS points. Back this up.
      - ./mapmatch-data:/data
      # - /var/lib/docker/volumes/valhalla/_data:/valhalla:ro
    ports:
      - "8080:8080"
    networks:
      - dawarich

networks:
  dawarich:
    external: true
    # The network your Dawarich containers are on (`docker network ls`).
    name: dawarich
